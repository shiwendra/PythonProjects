<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Manager</title>
    <link
      rel="stylesheet"
      href="{{ url_for('static', filename='style.css') }}"
    />
  </head>
  <body>
    <div class="container">
      <h1>Password Manager</h1>
      <p class="subtitle">Store and manage your saved logins in one place.</p>

      <form id="password-form" class="card">
        <input id="entry-id" type="hidden" />
        <div class="form-group">
          <label for="site">Site</label>
          <input id="site" name="site" placeholder="example.com" required />
        </div>
        <div class="form-group">
          <label for="username">Username</label>
          <input
            id="username"
            name="username"
            placeholder="your@email.com"
            required
          />
        </div>
        <div class="form-group">
          <label for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            placeholder="Enter password"
            required
          />
        </div>
        <div class="form-actions">
          <button type="submit" id="submit-btn">Save Password</button>
          <button
            type="button"
            id="cancel-edit-btn"
            class="secondary-btn hidden"
          >
            Cancel Edit
          </button>
        </div>
      </form>

      <div id="message" class="message"></div>

      <div class="card">
        <h2>Saved Credentials</h2>
        <table>
          <thead>
            <tr>
              <th>Site</th>
              <th>Username</th>
              <th>Password</th>
              <th>Created</th>
              <th>Action</th>
            </tr>
          </thead>
          <tbody id="password-table-body"></tbody>
        </table>
      </div>
    </div>

    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
